<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winter Boy VTuber</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden;
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #FFFFFF; touch-action: none;
        }
        .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        .glass-panel {
            background: rgba(28, 25, 24, 0.8);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.16);
        }
        .btn-active {
            background: linear-gradient(135deg, #78716c, #44403c) !important;
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.55) !important;
            box-shadow: 0 4px 15px rgba(68, 64, 60, 0.45);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes pulse-soft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .animate-pulse-soft { animation: pulse-soft 2.4s infinite ease-in-out; }
    </style>
</head>
<body class="relative w-full h-full flex flex-col justify-between text-white">

    <canvas id="bgCanvas" class="layer z-0"></canvas>
    <canvas id="glCanvas" class="layer z-0"></canvas>
    <canvas id="fxCanvas" class="layer z-0 cursor-grab active:cursor-grabbing"></canvas>
    <video id="webcamVideo" class="hidden" playsinline muted autoplay></video>
    <input id="modelFileInput" type="file" accept=".task,application/octet-stream" class="hidden">

    <header class="relative z-20 flex items-center justify-between px-3 pt-3 pb-2 pointer-events-none">
        <div class="glass-panel rounded-2xl px-3.5 py-2 flex items-center gap-2.5 pointer-events-auto shadow-lg">
            <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>
            <div>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold tracking-wider text-stone-200">WINTER BOY 2.5D</span>
                    <span id="fpsBadge" class="text-[10px] bg-white/10 px-1.5 py-0.5 rounded text-stone-300 font-mono">60 FPS</span>
                </div>
                <p id="statusText" class="text-[11px] text-stone-300">觸控互動中（滑動螢幕可吸引視線）</p>
            </div>
        </div>
        <div class="flex items-center gap-2 pointer-events-auto">
            <button onclick="calibratePose()" class="glass-panel hover:bg-white/15 active:scale-95 transition px-3 py-2 rounded-xl text-xs font-medium flex items-center gap-1 shadow-lg" title="校正正中間角度">
                <span>🎯</span> <span class="hidden sm:inline">回正校正</span>
            </button>
            <button id="btnGreenScreen" onclick="toggleGreenScreen()" class="glass-panel hover:bg-white/15 active:scale-95 transition px-3 py-2 rounded-xl text-xs font-medium flex items-center gap-1 shadow-lg" title="切換綠幕去背">
                <span>🟩</span> <span class="hidden sm:inline">綠幕</span>
            </button>
            <button onclick="toggleCleanUI()" class="glass-panel hover:bg-white/15 active:scale-95 transition px-3 py-2 rounded-xl text-xs font-medium shadow-lg" title="隱藏介面">👁️</button>
        </div>
    </header>

    <div id="camPreviewContainer" class="hidden absolute top-16 right-3 z-20 w-28 h-36 sm:w-36 sm:h-48 rounded-2xl overflow-hidden glass-panel shadow-2xl border-2 border-stone-400/50 pointer-events-auto">
        <canvas id="camPreviewCanvas" class="w-full h-full object-cover"></canvas>
        <div class="absolute bottom-1 left-1.5 right-1.5 flex justify-between items-center text-[10px] bg-black/60 px-1.5 py-0.5 rounded backdrop-blur-sm">
            <span class="text-emerald-300 font-semibold">ARKit 52點</span>
            <button onclick="togglePreviewWindow()" class="text-white/80 hover:text-white">✕</button>
        </div>
    </div>

    <div id="touchHint" class="relative z-10 mx-auto my-auto pointer-events-none flex flex-col items-center opacity-0 transition-opacity duration-500">
        <div class="glass-panel px-4 py-2 rounded-full text-xs text-stone-200 shadow-lg text-center">
            💡 手指滑動螢幕可轉頭看你，在毛帽上來回滑動可以摸摸頭！
        </div>
    </div>

    <div id="toastMsg" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 glass-panel px-4 py-2.5 rounded-2xl text-xs text-white shadow-2xl border border-stone-400/40 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-10px]">訊息提示</div>

    <footer id="bottomUI" class="relative z-20 p-3 pb-4 flex flex-col gap-2.5 max-w-xl mx-auto w-full pointer-events-auto transition-transform duration-300">
        <div class="flex items-center gap-2">
            <button id="btnCamera" onclick="toggleCameraTracking()" class="flex-1 py-2.5 px-4 rounded-2xl font-bold text-xs sm:text-sm bg-gradient-to-r from-stone-700 via-stone-600 to-stone-700 border border-stone-400/30 text-white shadow-lg shadow-black/40 active:scale-95 transition flex items-center justify-center gap-2 animate-pulse-soft">
                <span>📷</span><span id="camBtnText">開啟手機前鏡頭同步</span>
            </button>
            <button onclick="cycleBgMode()" class="glass-panel py-2.5 px-3.5 rounded-2xl text-xs font-bold hover:bg-white/10 active:scale-95 transition flex items-center gap-1.5 shrink-0">
                <span>❄️</span><span id="bgModeName">純白</span>
            </button>
        </div>
        <div class="glass-panel rounded-2xl p-1.5 flex items-center gap-1.5 overflow-x-auto no-scrollbar">
            <button onclick="setExpression(0)" class="exp-btn btn-active shrink-0 px-3 py-1.5 rounded-xl text-xs font-medium transition flex items-center gap-1"><span>🙂</span><span>原圖淺笑</span></button>
            <button onclick="setExpression(1)" class="exp-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-medium text-gray-200 hover:bg-white/10 transition flex items-center gap-1"><span>😳</span><span>害羞臉紅</span></button>
            <button onclick="setExpression(2)" class="exp-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-medium text-gray-200 hover:bg-white/10 transition flex items-center gap-1"><span>✨</span><span>閃亮眼神</span></button>
            <button onclick="setExpression(3)" class="exp-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-medium text-gray-200 hover:bg-white/10 transition flex items-center gap-1"><span>😊</span><span>開心瞇眼</span></button>
            <button onclick="setExpression(4)" class="exp-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-medium text-gray-200 hover:bg-white/10 transition flex items-center gap-1"><span>😑</span><span>認真半眼</span></button>
            <button onclick="setExpression(5)" class="exp-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-medium text-gray-200 hover:bg-white/10 transition flex items-center gap-1"><span>😮</span><span>驚訝</span></button>
            <button onclick="triggerHeadpat()" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-medium bg-amber-500/20 border border-amber-400/30 text-amber-200 hover:bg-amber-500/30 active:scale-95 transition flex items-center gap-1"><span>👋</span><span>摸摸毛帽</span></button>
        </div>
    </footer>

        // =========================================================================
        // 1. 彈簧
        // =========================================================================
        class Spring2D {
            constructor(stiffness = 140, damping = 12) {
                this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
                this.stiffness = stiffness; this.damping = damping;
            }
            update(tx, ty, dt) {
                const h = Math.min(Math.max(dt, 0.001), 0.04);
                this.vx += (-this.stiffness * (this.x - tx) - this.damping * this.vx) * h;
                this.vy += (-this.stiffness * (this.y - ty) - this.damping * this.vy) * h;
                this.x += this.vx * h;
                this.y += this.vy * h;
                return this;
            }
        }
        const springs = {
            hat: new Spring2D(220, 14),
            bangs: new Spring2D(200, 12),
            tailL: new Spring2D(90, 7),
            tailR: new Spring2D(90, 7),
            body: new Spring2D(130, 14)
        };

        // =========================================================================

        const rawPose = { yaw: 0, pitch: 0, roll: 0, hx: 0, hy: 0 };
        const calibOffset = { yaw: 0, pitch: 0, roll: 0, hx: 0, hy: 0 };
        const targetParams = { yaw: 0, pitch: 0, roll: 0, hx: 0, hy: 0, eyeL: 1, eyeR: 1, gazeX: 0, gazeY: 0, mouthOpen: 0, mouthForm: 0 };
        const P = { ...targetParams };
        const lerp = (a, b, t) => a + (b - a) * t;
        function updateSmooth(dt) {
            // 與幀率無關的指數平滑；鏡頭模式的雜訊已由 One Euro 濾波處理，這裡只做最後的柔化
            const k1 = 1 - Math.exp(-dt * (isCameraActive ? 18 : 10));
            const k2 = 1 - Math.exp(-dt * (isCameraActive ? 30 : 26));
            for (const k of ["yaw", "pitch", "roll", "hx", "hy", "gazeX", "gazeY", "mouthForm"]) P[k] = lerp(P[k], targetParams[k], k1);
            for (const k of ["eyeL", "eyeR", "mouthOpen"]) P[k] = lerp(P[k], targetParams[k], k2);
        }

        // One Euro 濾波：靜止時強力去抖，快速動作時降低延遲
        class OneEuro {
            constructor(minCutoff, beta, dCutoff = 1.0) {
                this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff;
                this.x = null; this.dx = 0;
            }
            alpha(cutoff, dt) { const r = 2 * Math.PI * cutoff * dt; return r / (r + 1); }
            filter(v, dt) {
                if (this.x === null) { this.x = v; return v; }
                const dx = (v - this.x) / dt;
                this.dx = lerp(this.dx, dx, this.alpha(this.dCutoff, dt));
                const cutoff = this.minCutoff + this.beta * Math.abs(this.dx);
                this.x = lerp(this.x, v, this.alpha(cutoff, dt));
                return this.x;
            }
            reset() { this.x = null; this.dx = 0; }
        }
        const filters = {
            yaw: new OneEuro(0.9, 0.04), pitch: new OneEuro(0.9, 0.04), roll: new OneEuro(0.9, 0.04),
            hx: new OneEuro(0.8, 1.2), hy: new OneEuro(0.8, 1.2),
            eyeL: new OneEuro(1.2, 1.5), eyeR: new OneEuro(1.2, 1.5),
            gazeX: new OneEuro(0.6, 0.6), gazeY: new OneEuro(0.6, 0.6),

        async function fetchModel() {
            if (localModelBuffer) return localModelBuffer;

        function pickModelFile() {

                input.value = "";
                input.onchange = async () => {
                    const f = input.files && input.files[0];
                    resolve(f ? new Uint8Array(await f.arrayBuffer()) : null);
                };
                input.click();
            });
        }

        async function initFaceLandmarker() {
            if (faceLandmarker) return true;
            if (isModelLoading) return false;
            isModelLoading = true;

                return false;
            };
            document.getElementById("camBtnText").textContent = "載入 AI 模型中...";

            // 1) 函式庫 + wasm
            let vision = null, fileset = null, lastErr = null;
            for (const base of LIB_SOURCES) {
                try {
                    setStatus("載入臉部捕捉程式庫…");

            }
            if (!vision) {
                return fail("⚠️ 臉部捕捉程式庫下載失敗（" + (lastErr && lastErr.message) + "）。請確認網路，並用 Chrome / Safari 直接開啟此檔案。");
            }

            // 2) 模型檔
            let model = null;
            try {
                setStatus("下載臉部模型（約 3.6MB）…");
                model = await fetchModel();
            } catch (err) {
                console.warn("模型下載失敗", err);
                if (confirm("臉部模型下載失敗（" + err.message + "）。\n\n如果你已經下載過 face_landmarker.task，可以按「確定」手動選擇檔案。")) {
                    model = await pickModelFile();
                    if (model) localModelBuffer = model;
                }
                if (!model) return fail("⚠️ 臉部模型下載失敗，您仍可使用手指觸控互動！");
            }

            // 3) 建立偵測器（GPU 不行就改用 CPU）
            for (const delegate of ["GPU", "CPU"]) {
                try {
                    setStatus("初始化臉部捕捉（" + delegate + "）…");
                    faceLandmarker = await vision.FaceLandmarker.createFromOptions(fileset, {
                        baseOptions: { modelAssetBuffer: model, delegate },
                        outputFaceBlendshapes: true, runningMode: "VIDEO", numFaces: 1
                    });
                    isModelLoading = false;
                    return true;
                } catch (err) { lastErr = err; console.warn("初始化失敗", delegate, err); }
            }
            return fail("⚠️ 臉部捕捉初始化失敗（" + (lastErr && lastErr.message) + "）");
        }

        async function toggleCameraTracking() {
            const btnCam = document.getElementById("btnCamera");
            const statusDot = document.getElementById("statusDot");
            const statusText = document.getElementById("statusText");
            const previewBox = document.getElementById("camPreviewContainer");
            if (isCameraActive) {
                isCameraActive = false;
                if (videoEl.srcObject) { videoEl.srcObject.getTracks().forEach(t => t.stop()); videoEl.srcObject = null; }
                previewBox.classList.add("hidden");
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping";
                setStatus("觸控互動中（滑動螢幕可吸引視線）");
                document.getElementById("camBtnText").textContent = "開啟手機前鏡頭同步";
                btnCam.classList.add("animate-pulse-soft");
                Object.assign(targetParams, { mouthOpen: 0, mouthForm: 0, eyeL: 1, eyeR: 1 });
                showToast("📷 已關閉前鏡頭，切換回手指觸控模式");
                return;
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showToast("⚠️ 當前環境不支援開啟相機，請使用觸控滑動互動！");
                return;
            }
            if (!(await initFaceLandmarker())) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 30 } }, audio: false });
                Object.values(filters).forEach(f => f.reset());
                calib.openL = calib.openR = calib.jaw0 = null;
                calib.closeL = calib.closeR = 0.72;
                previewCanvas.width = 140; previewCanvas.height = 180;
                videoEl.srcObject = stream;
                await videoEl.play();
                isCameraActive = true;
                previewBox.classList.remove("hidden");
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
                setStatus("前鏡頭同步中");
                document.getElementById("camBtnText").textContent = "關閉鏡頭（切回觸控）";
                btnCam.classList.remove("animate-pulse-soft");
                showToast("✨ 前鏡頭同步已啟動！試著轉頭、眨眼、張嘴吧");
            } catch (err) {
                console.error(err);
                showToast("⚠️ 無法開啟前鏡頭（請確認權限），可直接使用觸控滑動互動！");
                document.getElementById("camBtnText").textContent = "開啟手機前鏡頭同步";
            }
        }
        function togglePreviewWindow() { document.getElementById("camPreviewContainer").classList.toggle("hidden"); }

        // 偵測限頻：預設約 30 次/秒，手機較慢時自動放寬，避免拖慢畫面
        let lastDetectAt = 0, detectInterval = 33, lastDetectDt = 0.033, detectCount = 0, detectRateTimer = 0;
        let statusCache = "";
        function setStatus(text) {
            if (text === statusCache) return;   // 只在文字改變時才動 DOM
            statusCache = text;
            document.getElementById("statusText").textContent = text;
        }
        let previewTick = 0;

        function processWebcamFrame(now) {
            if (!isCameraActive || !faceLandmarker || videoEl.readyState < 2) return;
            if (videoEl.currentTime === lastVideoTime) return;
            if (now - lastDetectAt < detectInterval) return;
            const dt = Math.min(0.2, Math.max(0.008, (now - lastDetectAt) / 1000));
            lastDetectAt = now;
            lastVideoTime = videoEl.currentTime;

            const t0 = performance.now();
            const result = faceLandmarker.detectForVideo(videoEl, now);
            const cost = performance.now() - t0;
            // 偵測本身很花時間時，拉長間隔，讓畫面保持流暢
            detectInterval = Math.max(33, Math.min(80, detectInterval * 0.9 + cost * 1.6 * 0.1));
            detectCount++;

            const previewBox = document.getElementById("camPreviewContainer");
            const showPreview = !previewBox.classList.contains("hidden") && (previewTick++ % 2 === 0);
            if (showPreview) {
                previewCtx.save(); previewCtx.scale(-1, 1); previewCtx.drawImage(videoEl, -140, 0, 140, 180); previewCtx.restore();
            }

            if (!result.faceLandmarks || result.faceLandmarks.length === 0) {
                setStatus("未偵測到人臉（請對準鏡頭）");
                return;
            }
            setStatus("臉部同步中");
            const lm = result.faceLandmarks[0];
            if (showPreview) {
                previewCtx.fillStyle = "#34d399";
                for (const i of [1, 33, 133, 362, 263, 13, 14, 61, 291, 468, 473]) {
                    if (!lm[i]) continue;
                    previewCtx.beginPath(); previewCtx.arc((1 - lm[i].x) * 140, lm[i].y * 180, 2, 0, Math.PI * 2); previewCtx.fill();
                }
            }
            const lc = lm[234], rc = lm[454], top = lm[10], chin = lm[152], nose = lm[1];
            const faceW = Math.hypot(rc.x - lc.x, rc.y - lc.y) + 1e-5;
            const faceH = Math.hypot(chin.x - top.x, chin.y - top.y) + 1e-5;
            const cx = (lc.x + rc.x) * 0.5, cy = (top.y + chin.y) * 0.5;
            rawPose.yaw = -((nose.x - cx) / (faceW * 0.5)) * 50;
            rawPose.pitch = ((nose.y - cy) / (faceH * 0.5) - 0.06) * 55;
            rawPose.roll = -Math.atan2(lm[263].y - lm[33].y, lm[263].x - lm[33].x) * 180 / Math.PI;
            rawPose.hx = -(cx - 0.5) * 2;
            rawPose.hy = (cy - 0.5) * 2;
            const clamp = (v, m) => Math.max(-m, Math.min(m, v));
            const clamp01 = v => Math.max(0, Math.min(1, v));
            targetParams.yaw = filters.yaw.filter(clamp(rawPose.yaw - calibOffset.yaw, 30), dt);
            targetParams.pitch = filters.pitch.filter(clamp(rawPose.pitch - calibOffset.pitch, 24), dt);
            targetParams.roll = filters.roll.filter(clamp(rawPose.roll - calibOffset.roll, 20), dt);
            targetParams.hx = filters.hx.filter(clamp(rawPose.hx - calibOffset.hx, 0.85), dt);
            targetParams.hy = filters.hy.filter(clamp(rawPose.hy - calibOffset.hy, 0.75), dt);

            if (!result.faceBlendshapes || !result.faceBlendshapes.length) return;
            const bs = {};
            for (const c of result.faceBlendshapes[0].categories) bs[c.categoryName] = c.score;
            const g = n => bs[n] || 0;

            // --- 眼睛：依個人基準換算開合 ---
            const bL = g("eyeBlinkRight"), bR = g("eyeBlinkLeft");   // 鏡像
            lastRawFace = { bL, bR, jaw: g("jawOpen") };
            // 睜眼基準 = 你平常睜眼時數值的「平均」（眨眼時不計入），約 1.5 秒適應
            //   小眼睛的人平常數值偏高，這裡會自動把它當成「全開」
            const rest = (ref, v, band, tau) =>
                ref === null ? v : (v < ref + band ? lerp(ref, v, 1 - Math.exp(-dt / tau)) : ref);
            calib.openL = rest(calib.openL, bL, 0.15, 1.5);
            calib.openR = rest(calib.openR, bR, 0.15, 1.5);
            // 閉眼基準：追蹤最高值並緩慢回落，且至少比睜眼基準高 0.3
            calib.closeL = Math.min(0.98, Math.max(calib.openL + 0.3, Math.max(bL, calib.closeL - dt * 0.01)));
            calib.closeR = Math.min(0.98, Math.max(calib.openR + 0.3, Math.max(bR, calib.closeR - dt * 0.01)));
            // 睜眼基準往上留 0.07 的緩衝，吃掉平常的雜訊；超過才開始闔眼
            const eyeOpen = (b, o, c) => 1 - clamp01((b - o - 0.07) / Math.max(0.12, c - o - 0.12));
            let oL = eyeOpen(bL, calib.openL, calib.closeL);
            let oR = eyeOpen(bR, calib.openR, calib.closeR);
            // 死區：接近全開 / 全閉時直接吸附，避免眼皮線在邊界閃爍
            const dead = v => clamp01((v - 0.1) / 0.78);
            oL = dead(oL); oR = dead(oR);
            // 兩眼差不多時取平均，避免單眼雜訊造成大小眼；差很多（眨單眼）才分開
            if (Math.abs(oL - oR) < 0.35) oL = oR = (oL + oR) / 2;
            targetParams.eyeL = clamp01(filters.eyeL.filter(oL, dt));
            targetParams.eyeR = clamp01(filters.eyeR.filter(oR, dt));

            // --- 視線 ---
            const lookR = g("eyeLookInRight") + g("eyeLookOutLeft");
            const lookL = g("eyeLookOutRight") + g("eyeLookInLeft");
            const up = (g("eyeLookUpLeft") + g("eyeLookUpRight")) * 0.5;
            const down = (g("eyeLookDownLeft") + g("eyeLookDownRight")) * 0.5;
            const gzx = Math.abs(lookR - lookL) < 0.08 ? 0 : (lookR - lookL);
            targetParams.gazeX = filters.gazeX.filter(clamp(gzx * 1.1, 1), dt);
            targetParams.gazeY = filters.gazeY.filter(clamp((down - up) * 0.9, 1), dt);

            // --- 嘴巴：依個人閉嘴基準換算，0~1 連續 ---
            const jaw = g("jawOpen");
            calib.jaw0 = rest(calib.jaw0, jaw, 0.06, 3);
            const mOpen = clamp01((jaw - calib.jaw0 - 0.04) / 0.45);
            targetParams.mouthOpen = clamp01(filters.mouthOpen.filter(Math.pow(mOpen, 0.85), dt));
            const smile = (g("mouthSmileLeft") + g("mouthSmileRight")) * 0.5;
            const pucker = g("mouthPucker") + g("mouthFunnel") * 0.7;
            targetParams.mouthForm = filters.mouthForm.filter(clamp(smile * 1.4 - pucker * 1.2, 1), dt);
        }

        // =========================================================================
        // 4. 網格變形：每個原圖座標點依照頭部/臉部權重位移
        // =========================================================================
        const smooth = (e0, e1, x) => { const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };
        const view = { s: 0.4, ax: 200, ay: 300 };
        const pose = { yawN: 0, pitchN: 0, roll: 0, hx: 0, hy: 0, breath: 0, squash: 0 };

        function headWeight(x, y) {
            return 1 - smooth(0.82, 1.12, Math.hypot((x - 580) / 400, (y - 420) / 385));
        }
        function warp(x, y) {
            const wh = headWeight(x, y);
            const wf = 1 - smooth(0.5, 1.05, Math.hypot((x - 590) / 240, (y - 545) / 215));
            const wtop = wh * (1 - smooth(150, 330, y));
            const wbang = wh * (1 - smooth(0.6, 1.0, Math.hypot((x - 600) / 280, (y - 390) / 110))) * (1 - wtop);
            let dx = pose.yawN * (24 * wh + 20 * wf) + pose.hx * wh + springs.hat.x * wtop + springs.bangs.x * wbang;
            let dy = pose.pitchN * (16 * wh + 14 * wf) + pose.hy * wh + springs.hat.y * wtop * 0.6 + pose.squash * wtop;

            // 身體與呼吸
            const wbody = 1 - wh;
            dx += springs.body.x * wbody;
            dy += springs.body.y * wbody * 0.6 - pose.breath * (3 + 4 * smooth(650, 1000, y) * (1 - smooth(1100, 1500, y)));

            // 圍巾尾擺動
            const wt = smooth(950, 1400, y);
            dx += springs.tailL.x * wt * (1 - smooth(110, 160, Math.abs(x - 300)));
            dx += springs.tailR.x * wt * (1 - smooth(90, 140, Math.abs(x - 895)));

            // 以脖子為軸心的歪頭
            const a = pose.roll * wh;
            if (a !== 0) {
                const px = x + dx - 580, py = y + dy - 820;
                const c = Math.cos(a), s = Math.sin(a);
                return { x: 580 + px * c - py * s, y: 820 + px * s + py * c, a };
            }
            return { x: x + dx, y: y + dy, a: 0 };
        }
        function toScreen(p) {
            return { x: view.ax + (p.x - FACE.x) * view.s, y: view.ay + (p.y - FACE.y) * view.s };
        }
        function screenToOrig(sx, sy) {
            return { x: (sx - view.ax) / view.s + FACE.x, y: (sy - view.ay) / view.s + FACE.y };
        }

        // =========================================================================
        // 5. WebGL
        // =========================================================================
        const glCanvas = document.getElementById("glCanvas");
        const gl = glCanvas.getContext("webgl", { alpha: true, premultipliedAlpha: true, antialias: false, powerPreference: "high-performance" });
        const COLS = 44, ROWS = 42;
        let posBuf, posArr, idxCount, uRes, texReady = false;
        const texImg = new Image();

        function initGL() {
            const vs = `attribute vec2 aPos; attribute vec2 aUV; uniform vec2 uRes; varying vec2 vUV;
                void main(){ vec2 c = aPos / uRes * 2.0 - 1.0; gl_Position = vec4(c.x, -c.y, 0.0, 1.0); vUV = aUV; }`;
            const fs = `precision mediump float; varying vec2 vUV; uniform sampler2D uTex;
                void main(){ gl_FragColor = texture2D(uTex, vUV); }`;
            const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
            const prog = gl.createProgram();
            gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
            gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
            gl.linkProgram(prog);
            gl.useProgram(prog);
            uRes = gl.getUniformLocation(prog, "uRes");

            const uv = [], idx = [];
            for (let r = 0; r <= ROWS; r++) for (let c = 0; c <= COLS; c++) uv.push(c / COLS, r / ROWS);
            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
                const i = r * (COLS + 1) + c;
                idx.push(i, i + 1, i + COLS + 1, i + 1, i + COLS + 2, i + COLS + 1);
            }
            idxCount = idx.length;
            posArr = new Float32Array(uv.length);

            const uvBuf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(uv), gl.STATIC_DRAW);
            const aUV = gl.getAttribLocation(prog, "aUV");
            gl.enableVertexAttribArray(aUV);
            gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 0, 0);

            posBuf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
            gl.bufferData(gl.ARRAY_BUFFER, posArr, gl.DYNAMIC_DRAW);
            const aPos = gl.getAttribLocation(prog, "aPos");
            gl.enableVertexAttribArray(aPos);
            gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

            const ib = gl.createBuffer();
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);

            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, texImg);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
            texReady = true;
        }

        function drawCharacter(cw, ch, dpr) {
            if (!texReady) return;
            let k = 0;
            for (let r = 0; r <= ROWS; r++) {
                const oy = (r / ROWS) * TEX_H;
                for (let c = 0; c <= COLS; c++) {
                    const ox = (c / COLS) * TEX_W - EX;
                    const s = toScreen(warp(ox, oy));
                    posArr[k++] = s.x;
                    posArr[k++] = s.y;
                }
            }
            gl.viewport(0, 0, glCanvas.width, glCanvas.height);
            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.uniform2f(uRes, cw, ch);
            gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, posArr);
            gl.drawElements(gl.TRIANGLES, idxCount, gl.UNSIGNED_SHORT, 0);
        }

        // =========================================================================
        // 6. 五官疊加層（跟著網格位移，畫在原圖座標上）
        // =========================================================================
        const fxCanvas = document.getElementById("fxCanvas");
        const fx = fxCanvas.getContext("2d");
        let dprNow = 1;

        function withFeature(ox, oy, fn) {
            const w = warp(ox, oy);
            const s = toScreen(w);
            fx.save();
            fx.setTransform(dprNow, 0, 0, dprNow, 0, 0);
            fx.translate(s.x, s.y);
            fx.rotate(w.a);
            fx.scale(view.s, view.s);
            fx.translate(-ox, -oy);
            fn();
            fx.restore();
        }

        function skinCover(e, clipFn, closed = false, alpha = 1) {
            const p = patches[closed ? e.patch + "c" : e.patch];
            if (!p.img.complete) return;
            fx.save();
            if (clipFn) clipFn();
            fx.globalAlpha = alpha;
            fx.drawImage(p.img, p.x, p.y, p.w, p.h);
            fx.restore();
        }

        function strokeCurve(pts, w) {
            fx.beginPath();
            fx.moveTo(pts[0][0], pts[0][1]);
            fx.quadraticCurveTo(pts[1][0], pts[1][1], pts[2][0], pts[2][1]);
            fx.lineWidth = w;
            fx.strokeStyle = LINE;
            fx.lineCap = "round";
            fx.stroke();
        }

        function drawEyeOverlay(e, open, time) {
            const happy = headpatTimer > 0 || expressionMode === 3;
            // 闔眼程度 0（全開）~ 1（全閉），連續變化
            let c = 1 - Math.max(0, Math.min(1, open));
            if (expressionMode === 4) c = Math.max(c, 0.36);            // 認真半眼
            if (expressionMode !== 5) c += Math.max(0, P.gazeY) * 0.18;  // 往下看時眼皮自然下垂
            if (expressionMode === 5) c *= 0.6;                          // 驚訝時眼睛睜大
            c = Math.max(0, Math.min(1, c));

            if (happy || c > 0.94) {
                // 閉眼：只留一條閉眼線，不畫睫毛和雙眼皮
                skinCover(e, null, true);
                strokeCurve(happy ? e.happy : e.closed, 7);
                return;
            }

            // 視線：只移動眼白內的虹膜
            const gx = P.gazeX * 7, gy = P.gazeY * 4;
            if (Math.abs(gx) > 0.4 || Math.abs(gy) > 0.4) {
                fx.save();
                fx.beginPath();
                fx.ellipse(e.inner.x, e.inner.y, e.inner.rx, e.inner.ry, 0, 0, Math.PI * 2);
                fx.clip();
                const x0 = e.inner.x - e.inner.rx - 14, y0 = e.inner.y - e.inner.ry - 14;
                const w = e.inner.rx * 2 + 28, h = e.inner.ry * 2 + 28;
                fx.drawImage(texImg, x0 + EX - gx, y0 - gy, w, h, x0, y0, w, h);
                fx.restore();
            }

            const lidA = smooth(0.06, 0.24, c);   // 眼皮線淡入，避免微小雜訊造成閃爍
            if (lidA > 0.01) {
                fx.save();
                fx.globalAlpha = lidA;
                // 眼皮弧線：從原本上眼線的拱形，連續過渡到閉眼時的下彎弧
                const [L, , R] = e.closed;
                const ease = c * c * (3 - 2 * c);
                const ctrlX = lerp((L[0] + R[0]) / 2, e.closed[1][0], ease);
                const ctrlY = lerp(e.openCtrlY, e.closed[1][1], ease);
                const lidPath = () => {
                    fx.moveTo(L[0], L[1]);
                    fx.quadraticCurveTo(ctrlX, ctrlY, R[0], R[1]);
                };
                // 眼皮以上的部分換成皮膚；快閉上時雙眼皮線漸漸淡掉
                const lidClip = () => {
                    fx.beginPath();
                    fx.moveTo(L[0] - 40, e.top - 70);
                    fx.lineTo(R[0] + 40, e.top - 70);
                    fx.lineTo(R[0] + 40, R[1]);
                    fx.lineTo(R[0], R[1]);
                    fx.quadraticCurveTo(ctrlX, ctrlY, L[0], L[1]);
                    fx.lineTo(L[0] - 40, L[1]);
                    fx.closePath();
                    fx.clip();
                };
                skinCover(e, lidClip);
                const creaseFade = Math.max(0, Math.min(1, (c - 0.55) / 0.39));
                if (creaseFade > 0) skinCover(e, lidClip, true, creaseFade);
                // 眼皮下緣的淡陰影
                fx.save();
                fx.translate(0, 5);
                fx.beginPath();
                lidPath();
                fx.lineWidth = 9;
                fx.strokeStyle = "rgba(90,60,55,0.18)";
                fx.stroke();
                fx.restore();
                // 睫毛線（越閉越細）
                fx.beginPath();
                lidPath();
                fx.lineWidth = lerp(10, 7, ease);
                fx.strokeStyle = LINE;
                fx.lineCap = "round";
                fx.stroke();
                const flickA = 1 - ease;   // 外眼角睫毛隨闔眼淡出
                if (flickA > 0.05) {
                    fx.globalAlpha = flickA * lidA;
                    fx.beginPath();
                    fx.moveTo(e.flick[0][0], e.flick[0][1]);
                    fx.lineTo(e.flick[1][0], e.flick[1][1] + ease * 6);
                    fx.lineWidth = 6;
                    fx.stroke();
                }
                fx.restore();
            }

            if (expressionMode === 2 && c < 0.5) {
                const pulse = 1 + Math.sin(time * 7) * 0.18;
                fx.fillStyle = "rgba(255,252,235,0.95)";
                drawFourPointStar(fx, e.star.x, e.star.y, 17 * pulse);
                fx.fill();
            }
        }

        // 嘴巴：張開時先蓋掉原圖的嘴線，再畫一張隨開合連續變形的嘴
        function drawMouthOverlay(open, form) {
            let o = Math.max(0, Math.min(1, open));
            if (expressionMode === 5) o = Math.max(o, 0.55);
            if (o < 0.04) return;                       // 幾乎閉嘴：直接用原圖的嘴線
            const a = smooth(0.04, 0.12, o);            // 剛開始張嘴時淡入
            const { x, y } = MOUTH;
            const f = Math.max(-1, Math.min(1, form || 0));
            // 寬度：越張越收（自然的「啊」形），笑會變寬、嘟嘴會變窄
            const halfW = Math.max(14, lerp(46, 30, o) + f * 8 - (expressionMode === 5 ? 10 : 0));
            const h = 4 + o * 54;                       // 0~1 對應很小到很大
            const lift = f * 6;                         // 笑時嘴角上揚
            const lx = x - halfW, rx = x + halfW;
            const ly = y - lift, ry = y - 2 - lift;
            const topCtrlY = y + 2 - h * 0.12;
            const botCtrlY = y + h * 1.35;

            fx.save();
            fx.globalAlpha = a;
            if (mouthPatch.img.complete) fx.drawImage(mouthPatch.img, mouthPatch.x, mouthPatch.y, mouthPatch.w, mouthPatch.h);

            const shape = () => {
                fx.beginPath();
                fx.moveTo(lx, ly);
                fx.quadraticCurveTo(x, topCtrlY, rx, ry);
                fx.bezierCurveTo(rx - halfW * 0.08, ry + h * 0.7, x + halfW * 0.55, botCtrlY, x, botCtrlY - h * 0.08);
                fx.bezierCurveTo(x - halfW * 0.55, botCtrlY, lx + halfW * 0.08, ly + h * 0.7, lx, ly);
                fx.closePath();
            };
            shape();
            fx.fillStyle = "#5E2A2B";
            fx.fill();
            fx.save();
            shape();
            fx.clip();
            // 上排牙齒（張大一點才看得到）
            if (o > 0.25) {
                fx.fillStyle = "rgba(255,255,255,0.92)";
                fx.beginPath();
                fx.moveTo(lx, ly);
                fx.quadraticCurveTo(x, topCtrlY, rx, ry);
                fx.lineTo(rx, ry + h * 0.16);
                fx.quadraticCurveTo(x, topCtrlY + h * 0.18, lx, ly + h * 0.16);
                fx.closePath();
                fx.fill();
            }
            // 舌頭
            fx.fillStyle = "#D7767A";
            fx.beginPath();
            fx.ellipse(x, botCtrlY - h * 0.12, halfW * 0.62, h * 0.32, 0, 0, Math.PI * 2);
            fx.fill();
            fx.restore();
            // 外框：上唇線粗、下緣細，接近原圖線條
            fx.lineCap = "round";
            fx.lineJoin = "round";
            fx.strokeStyle = "#4A2420";
            fx.lineWidth = 4.2;
            fx.beginPath();
            fx.moveTo(lx, ly);
            fx.quadraticCurveTo(x, topCtrlY, rx, ry);
            fx.stroke();
            fx.lineWidth = 2.6;
            shape();
            fx.stroke();
            fx.restore();
        }

        function drawBlush(amt) {
            for (const p of [{ x: 452, y: 578 }, { x: 768, y: 574 }]) {
                const g = fx.createRadialGradient(p.x, p.y, 4, p.x, p.y, 70);
                g.addColorStop(0, `rgba(240,120,110,${amt})`);
                g.addColorStop(1, "rgba(240,120,110,0)");
                fx.fillStyle = g;
                fx.beginPath();
                fx.ellipse(p.x, p.y, 70, 48, 0, 0, Math.PI * 2);
                fx.fill();
                fx.strokeStyle = `rgba(205,85,75,${amt * 0.8})`;
                fx.lineWidth = 3;
                fx.lineCap = "round";
                for (let k = -1; k <= 1; k++) {
                    fx.beginPath();
                    fx.moveTo(p.x + k * 18 - 5, p.y - 9);
                    fx.lineTo(p.x + k * 18 + 5, p.y + 9);
                    fx.stroke();
                }
            }
        }

        function drawFourPointStar(c, cx, cy, r) {
            c.beginPath();
            for (let i = 0; i < 8; i++) {
                const rad = i % 2 === 0 ? r : r * 0.28, ang = i * Math.PI / 4;
                const x = cx + Math.cos(ang) * rad, y = cy + Math.sin(ang) * rad;
                i === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
            }
            c.closePath();
        }
        function drawHeartShape(c, cx, cy, size) {
            const t = size * 0.3;
            c.beginPath();
            c.moveTo(cx, cy + t);
            c.bezierCurveTo(cx, cy, cx - size / 2, cy, cx - size / 2, cy + t);
            c.bezierCurveTo(cx - size / 2, cy + (size + t) / 2, cx, cy + (size + t) / 1.4, cx, cy + size);
            c.bezierCurveTo(cx, cy + (size + t) / 1.4, cx + size / 2, cy + (size + t) / 2, cx + size / 2, cy + t);
            c.bezierCurveTo(cx + size / 2, cy, cx, cy, cx, cy + t);
            c.closePath();
        }

        // =========================================================================
        // 7. 觸控
        // =========================================================================
        let isPointerDown = false, lastInteractionTime = 0;

        function handlePointerMove(cx, cy) {
            if (isCameraActive) return;
            lastInteractionTime = performance.now();
            const nx = (cx / window.innerWidth - 0.5) * 2;
            const ny = (cy / window.innerHeight - 0.5) * 2;
            const o = screenToOrig(cx, cy);
            if (isPointerDown && o.y > 0 && o.y < 330 && o.x > 220 && o.x < 940) {
                if (headpatTimer <= 0) springs.hat.vx += 120;
                headpatTimer = 0.6;
                springs.hat.vx += (Math.random() - 0.5) * 80;
                if (Math.random() < 0.25) spawnParticle(cx, cy, Math.random() > 0.4 ? "heart" : "sparkle");
            }
            targetParams.yaw = Math.max(-28, Math.min(28, nx * 28));
            targetParams.pitch = Math.max(-20, Math.min(20, ny * 20));
            targetParams.roll = Math.max(-12, Math.min(12, nx * 8));
            targetParams.hx = nx * 0.35;
            targetParams.hy = ny * 0.25;
            targetParams.gazeX = Math.max(-1, Math.min(1, nx * 1.15));
            targetParams.gazeY = Math.max(-1, Math.min(1, ny * 1.15));
        }

        fxCanvas.addEventListener("pointerdown", (e) => {
            isPointerDown = true;
            handlePointerMove(e.clientX, e.clientY);
            const o = screenToOrig(e.clientX, e.clientY);
            if (!isCameraActive && Math.hypot(o.x - MOUTH.x, o.y - MOUTH.y) < 90) targetParams.mouthOpen = 0.6;
        });
        window.addEventListener("pointermove", (e) => { if (isPointerDown || e.pointerType === "mouse") handlePointerMove(e.clientX, e.clientY); });
        window.addEventListener("pointerup", () => {
            isPointerDown = false;
            if (!isCameraActive) targetParams.mouthOpen = 0;
        });

        function spawnParticle(x, y, type) {
            particles.push({
                x: x + (Math.random() - 0.5) * 60, y: y + (Math.random() - 0.5) * 24,
                vx: (Math.random() - 0.5) * 35, vy: -50 - Math.random() * 45,
                size: 12 + Math.random() * 10, alpha: 1, type
            });
        }

        // =========================================================================
        // 8. UI
        // =========================================================================
        function calibratePose() {
            if (isCameraActive) {
                Object.assign(calibOffset, rawPose);
                Object.values(filters).forEach(f => f.reset());
                if (lastRawFace) {
                    calib.openL = lastRawFace.bL; calib.openR = lastRawFace.bR;
                    calib.closeL = Math.max(calib.openL + 0.28, 0.6); calib.closeR = Math.max(calib.openR + 0.28, 0.6);
                    calib.jaw0 = lastRawFace.jaw;
                }
                showToast("🎯 已校正：目前的姿勢、睜眼程度與閉嘴狀態設為基準");
            }
            else { Object.assign(targetParams, { yaw: 0, pitch: 0, roll: 0, hx: 0, hy: 0, gazeX: 0, gazeY: 0 }); showToast("🎯 角色視角已回正！"); }
        }
        function toggleGreenScreen() {
            isGreenScreen = !isGreenScreen;
            document.getElementById("btnGreenScreen").classList.toggle("btn-active", isGreenScreen);
            showToast(isGreenScreen ? "🟩 已開啟綠幕去背模式" : "🎨 已恢復背景模式");
        }
        function toggleCleanUI() {
            isUIClean = !isUIClean;
            document.getElementById("bottomUI").style.transform = isUIClean ? "translateY(120%)" : "translateY(0)";
            if (isUIClean) showToast("已隱藏底部控制列（再點一次右上角 👁️ 恢復）");
        }
        function cycleBgMode() {
            currentBgIdx = (currentBgIdx + 1) % BG_MODES.length;
            document.getElementById("bgModeName").textContent = BG_MODES[currentBgIdx];
            showToast(`❄️ 背景已切換為「${BG_MODES[currentBgIdx]}」`);
        }
        function setExpression(mode) {
            expressionMode = mode;
            document.querySelectorAll(".exp-btn").forEach((b, i) => b.classList.toggle("btn-active", i === mode));
            springs.body.vy += 120;
            springs.hat.vy -= 160;
        }
        function triggerHeadpat() {
            headpatTimer = 1.6;
            springs.hat.vx += 220;
            const t = toScreen(warp(580, 150));
            for (let i = 0; i < 6; i++) setTimeout(() => spawnParticle(t.x + (Math.random() - 0.5) * 140, t.y, Math.random() > 0.4 ? "heart" : "sparkle"), i * 110);
            showToast("🧶 搓了搓毛帽～溫暖又柔和！");
        }

        // =========================================================================
        // 9. 背景與主迴圈
        // =========================================================================
        const bgCanvas = document.getElementById("bgCanvas");
        const bg = bgCanvas.getContext("2d");
        const flakes = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random(), r: 1.5 + Math.random() * 3, sp: 0.03 + Math.random() * 0.05, d: Math.random() * 6.28 }));

        function drawBackground(cw, ch, time) {
            if (isGreenScreen) { bg.fillStyle = "#00FF00"; bg.fillRect(0, 0, cw, ch); return; }
            if (currentBgIdx === 0) { bg.fillStyle = "#FFFFFF"; bg.fillRect(0, 0, cw, ch); return; }
            const g = bg.createLinearGradient(0, 0, 0, ch);
            if (currentBgIdx === 1) { g.addColorStop(0, "#3F3F46"); g.addColorStop(1, "#18181B"); }
            else { g.addColorStop(0, "#5A4436"); g.addColorStop(1, "#2A1E17"); }
            bg.fillStyle = g;
            bg.fillRect(0, 0, cw, ch);
            if (currentBgIdx === 1) {
                bg.fillStyle = "rgba(255,255,255,0.7)";
                for (const f of flakes) {
                    bg.beginPath();
                    bg.arc((f.x + Math.sin(time + f.d) * 0.02) * cw, ((f.y + time * f.sp) % 1) * ch, f.r, 0, Math.PI * 2);
                    bg.fill();
                }
            } else {
                for (let i = 0; i < 7; i++) {
                    const x = cw * (0.08 + i * 0.14), y = ch * (0.12 + (i % 2) * 0.06);
                    const lg = bg.createRadialGradient(x, y, 2, x, y, 60);
                    lg.addColorStop(0, "rgba(255,200,120,0.55)");
                    lg.addColorStop(1, "rgba(255,200,120,0)");
                    bg.fillStyle = lg;
                    bg.beginPath(); bg.arc(x, y, 60, 0, Math.PI * 2); bg.fill();
                }
            }
        }

        // 自然眨眼：快速闔上、稍慢張開，間隔隨機，偶爾連眨兩下
        let nextBlinkAt = 2, blinkStart = -10, blinkCount = 1;
        const BLINK_CLOSE = 0.07, BLINK_HOLD = 0.04, BLINK_OPEN = 0.16;
        function blinkValue(time) {
            const total = BLINK_CLOSE + BLINK_HOLD + BLINK_OPEN;
            if (time >= nextBlinkAt && time - blinkStart > total) {
                blinkStart = time;
                if (blinkCount > 1) { blinkCount--; nextBlinkAt = time + total + 0.08; }
                else {
                    blinkCount = Math.random() < 0.18 ? 2 : 1;
                    nextBlinkAt = blinkCount > 1 ? time + total + 0.08 : time + 2.2 + Math.random() * 3.8;
                }
            }
            const t = time - blinkStart;
            if (t < 0 || t > total) return 1;
            if (t < BLINK_CLOSE) { const u = t / BLINK_CLOSE; return 1 - u * u; }
            if (t < BLINK_CLOSE + BLINK_HOLD) return 0;
            const u = (t - BLINK_CLOSE - BLINK_HOLD) / BLINK_OPEN;
            return 1 - Math.pow(1 - u, 2.2);
        }

        let lastBgKey = "";
        function resize(c, cw, ch, dpr) {
            const w = Math.round(cw * dpr), h = Math.round(ch * dpr);
            if (c.width !== w || c.height !== h) { c.width = w; c.height = h; return 1; }
            return 0;
        }

        let lastFrame = performance.now(), fpsCount = 0, fpsTimer = performance.now();

        function renderLoop(now) {
            requestAnimationFrame(renderLoop);
            const dt = Math.min(0.05, (now - lastFrame) / 1000);
            lastFrame = now;
            const time = now / 1000;
            fpsCount++;
            if (now - fpsTimer >= 500) {
                document.getElementById("fpsBadge").textContent = `${Math.round(fpsCount * 1000 / (now - fpsTimer))} FPS`;
                fpsCount = 0; fpsTimer = now;
            }
            if (headpatTimer > 0) headpatTimer = Math.max(0, headpatTimer - dt);

            if (isCameraActive) processWebcamFrame(now);
            else {
                if ((now - lastInteractionTime) / 1000 > 2.5 && !isPointerDown) {
                    targetParams.yaw = Math.sin(time * 0.9) * 8 + Math.cos(time * 0.43) * 4;
                    targetParams.pitch = Math.sin(time * 0.7) * 5;
                    targetParams.roll = Math.sin(time * 0.8) * 3.5;
                    targetParams.hx = Math.sin(time * 0.55) * 0.12;
                    targetParams.hy = 0;
                    targetParams.gazeX = Math.sin(time * 0.65) * 0.35;
                    targetParams.gazeY = expressionMode === 1 ? 0.7 : Math.cos(time * 0.85) * 0.15;
                }
                const b = blinkValue(time);
                targetParams.eyeL = targetParams.eyeR = b;
                P.eyeL = P.eyeR = b;
                if (expressionMode === 5 && !isPointerDown) targetParams.mouthOpen = 0.5;
                else if (expressionMode !== 5 && !isPointerDown && targetParams.mouthOpen === 0.5) targetParams.mouthOpen = 0;
            }
            updateSmooth(dt);

            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            dprNow = dpr;
            const cw = window.innerWidth, ch = window.innerHeight;
            const resized = resize(bgCanvas, cw, ch, dpr) | resize(glCanvas, cw, ch, dpr) | resize(fxCanvas, cw, ch, dpr);
            // 靜態背景只在切換或尺寸改變時重畫；只有飄雪需要每格更新
            const bgKey = (isGreenScreen ? "g" : currentBgIdx) + "";
            if (resized || bgKey !== lastBgKey || (!isGreenScreen && currentBgIdx === 1)) {
                bg.setTransform(dpr, 0, 0, dpr, 0, 0);
                drawBackground(cw, ch, time);
                lastBgKey = bgKey;
            }

            // 版面：臉置於畫面上方約 4 成處
            view.s = Math.min(cw / 980, ch / 1250);
            view.ax = cw * 0.5;
            view.ay = Math.max(ch * 0.42, (FACE.y - 20) * view.s + 70);

            // 姿態與彈簧
            pose.yawN = P.yaw / 30;
            pose.pitchN = P.pitch / 24;
            pose.roll = P.roll * Math.PI / 180 * 0.7;
            pose.hx = P.hx * 40;
            pose.hy = P.hy * 26;
            pose.breath = Math.sin(time * 2.1);
            pose.squash = headpatTimer > 0 ? Math.sin(time * 18) * 6 + 6 : 0;
            springs.hat.update(-P.yaw * 0.5 - P.roll * 0.6, -P.pitch * 0.3, dt);
            springs.bangs.update(-P.yaw * 0.35 - P.roll * 0.4, 0, dt);
            springs.tailL.update(-P.yaw * 0.9 - P.roll * 1.2 - P.hx * 20, 0, dt);
            springs.tailR.update(-P.yaw * 0.9 - P.roll * 1.2 - P.hx * 20, 0, dt);
            springs.body.update(P.hx * 14 + P.yaw * 0.25, P.hy * 8, dt);

            drawCharacter(cw, ch, dpr);

            // 疊加層
            fx.setTransform(1, 0, 0, 1, 0, 0);
            fx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            if (texReady) {
                const blushAmt = expressionMode === 1 || headpatTimer > 0 ? 0.42 : (expressionMode === 3 ? 0.22 : 0);
                if (blushAmt > 0) withFeature(610, 575, () => drawBlush(blushAmt));
                withFeature(EYES[0].cover.x, EYES[0].cover.y, () => drawEyeOverlay(EYES[0], P.eyeL, time));
                withFeature(EYES[1].cover.x, EYES[1].cover.y, () => drawEyeOverlay(EYES[1], P.eyeR, time));
                withFeature(MOUTH.x, MOUTH.y, () => drawMouthOverlay(P.mouthOpen, P.mouthForm));
            }

            fx.setTransform(dpr, 0, 0, dpr, 0, 0);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt; p.y += p.vy * dt; p.alpha -= dt * 0.85;
                if (p.alpha <= 0) { particles.splice(i, 1); continue; }
                fx.globalAlpha = p.alpha;
                if (p.type === "heart") { fx.fillStyle = "#F28A6E"; drawHeartShape(fx, p.x, p.y, p.size); }
                else { fx.fillStyle = "#F59E0B"; drawFourPointStar(fx, p.x, p.y, p.size * 0.65); }
                fx.fill();
                fx.globalAlpha = 1;
            }
        }

        texImg.onload = () => {
            if (!gl) { showToast("⚠️ 此裝置不支援 WebGL"); return; }
            initGL();
        };
        texImg.src = TEX_SRC;

        window.onload = () => {
            const hint = document.getElementById("touchHint");
            setTimeout(() => { hint.style.opacity = "1"; }, 300);
            setTimeout(() => { hint.style.opacity = "0"; }, 4500);
            requestAnimationFrame(renderLoop);
        };
    </script>
</body>
</html>
